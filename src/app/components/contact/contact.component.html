<section class="contact-section" id="contact">
  <div class="contact-section__container">
    <div class="contact-section__left">
      <img src="/assets/images/contact-image.png" alt="Contact" class="contact-section__img" />
    </div>
    <div class="contact-section__center">
      <h2 class="contact-section__title">Contact Us</h2>
      <form class="contact-section__form">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" placeholder="" />
        </div>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="" />
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4" placeholder=""></textarea>
        </div>
        <button type="submit" class="contact-section__btn">Contact Us</button>
      </form>
    </div>
    <div class="contact-section__right">
      <div class="contact-section__info">
        <h3 class="contact-section__info-title">Contact</h3>
        <p class="contact-section__info-email">email&#64;example.com</p>
        <h3 class="contact-section__info-title">Based In</h3>
        <p class="contact-section__info-address">123 Main Street, City, Country</p>
        <div class="contact-section__socials">
          <a href="#" aria-label="Facebook" class="contact-section__social-icon">FB</a>
          <a href="#" aria-label="Instagram" class="contact-section__social-icon">IG</a>
          <a href="#" aria-label="Twitter" class="contact-section__social-icon">TW</a>
        </div>
      </div>
    </div>
  </div>
</section>
